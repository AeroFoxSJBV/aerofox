# Publishes the static showcase (showcase/) to GitHub Pages: https://aerofoxsjbv.github.io/aerofox/
# The showcase is the real AeroFox interface replaying answers recorded from the local model; it needs no server.
name: Deploy static showcase

on:
  push:
    branches: [main]
    paths: ["showcase/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: showcase
      - id: deployment
        uses: actions/deploy-pages@v4
